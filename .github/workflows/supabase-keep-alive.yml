name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */4 * *'   # every 4 days at noon UTC
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lfehkvzfhwwvjdtgvxqk.supabase.co/rest/v1/ctl_bias?select=date&limit=1" \
            -H "apikey: sb_publishable_lxnYYrpLsU8Z4hCIpkbEgw_AP50L1Hq" \
            -H "Authorization: Bearer sb_publishable_lxnYYrpLsU8Z4hCIpkbEgw_AP50L1Hq")
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status $STATUS"
            exit 1
          fi
          echo "Supabase is alive."
